<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ORBIT BREAKER</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04030a;}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none;}
#hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#8fa3ff;opacity:.55;
 font:12px/1.6 "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;pointer-events:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">クリック / タップ / スペース：軌道チェンジ　｜　M：ミュート</div>
<script>
"use strict";
(()=>{
const TAU=Math.PI*2;
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,CX=0,CY=0,S=0,DPR=1;
let stars=[];
function makeStars(){
  stars=[];
  const n=Math.floor(W*H/9000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4*DPR+0.4,p:Math.random()*TAU});
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=canvas.width=Math.floor(innerWidth*DPR);
  H=canvas.height=Math.floor(innerHeight*DPR);
  CX=W/2;CY=H/2;S=Math.min(W,H);
  makeStars();
}
addEventListener("resize",resize);
resize();

/* ---------- audio (WebAudio procedural) ---------- */
let AC=null,masterGain=null,muted=false;
function initAudio(){
  if(muted)return;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=AC.createGain();masterGain.gain.value=0.45;masterGain.connect(AC.destination);
    }
    if(AC.state==="suspended")AC.resume();
  }catch(e){AC=null;}
}
function tone(freq,dur,type,gain,slideTo){
  if(!AC||muted)return;
  try{
    const t0=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1),t0+dur);
    g.gain.setValueAtTime(gain||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(masterGain);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur,gain){
  if(!AC||muted)return;
  try{
    const t0=AC.currentTime,len=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=AC.createBufferSource();src.buffer=buf;
    const g=AC.createGain();g.gain.value=gain||0.25;
    src.connect(g);g.connect(masterGain);src.start(t0);
  }catch(e){}
}
const SCALE=[0,3,5,7,10,12,15,19];
function note(step,base,dur,type,gain){
  const st=SCALE[((step%SCALE.length)+SCALE.length)%SCALE.length]+12*Math.floor(step/SCALE.length);
  tone(base*Math.pow(2,st/12),dur,type,gain);
}

/* ---------- game state ---------- */
const RINGS=[0.155,0.265,0.375];
const ARC_HALF=0.016,SHIP_RAD=0.011;
let state="title";
let ship,obstacles,gems,parts,trail;
let t=0,score=0,best=0,combo=1,comboT=0,shake=0,flash=0,slowmo=1,overT=0,newBest=false;
let spawnT=0,gemT=0,beatT=0,beatN=0,hue=210;
try{best=+localStorage.getItem("ob_best")||0;}catch(e){}

function reset(){
  ship={ring:0,r:RINGS[0],a:-Math.PI/2,dir:1,shield:false,jumpCD:0};
  obstacles=[];gems=[];parts=[];trail=[];
  t=0;score=0;combo=1;comboT=0;shake=0;flash=0;slowmo=1;overT=0;newBest=false;
  spawnT=1.2;gemT=0.8;beatT=0;beatN=0;hue=210;
}
reset();

function ringR(i){return RINGS[i];}
function angNorm(a){a%=TAU;return a<0?a+TAU:a;}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function diffLv(){return Math.min(1,t/100);}
function P(r,a){return [CX+Math.cos(a)*r*S,CY+Math.sin(a)*r*S];}

/* ---------- spawning ---------- */
function spawnObstacle(){
  const d=diffLv();
  const ring=Math.floor(Math.random()*3);
  const span=0.5+Math.random()*(0.8+0.7*d);
  const w=(0.15+Math.random()*(0.25+0.45*d))*(Math.random()<0.5?-1:1);
  let a0=Math.random()*TAU;
  if(ring===ship.ring){
    const center=a0+span/2;
    const ahead=ship.a+ship.dir*0.9;
    if(Math.abs(angDiff(center,ahead))<span/2+0.9)a0+=Math.PI;
  }
  obstacles.push({ring,a0:angNorm(a0),span,w,life:0,maxLife:16+Math.random()*8});
}
function spawnGem(){
  if(gems.length>=4)return;
  gems.push({ring:Math.floor(Math.random()*3),a:Math.random()*TAU,spin:Math.random()*TAU,shield:Math.random()<0.08});
}
function boom(x,y,n,h,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=(Math.random()*0.5+0.2)*(spd||1)*S*0.6;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,maxLife:0.5+Math.random()*0.6,
      h:(h+Math.random()*40-20+360)%360,size:(Math.random()*2.5+1)*DPR});
  }
}

/* ---------- actions ---------- */
function jump(){
  if(ship.jumpCD>0)return;
  ship.jumpCD=0.12;
  ship.ring=(ship.ring+1)%3;
  tone(300+ship.ring*140,0.09,"square",0.05,180);
  const [x,y]=P(ship.r,ship.a);
  boom(x,y,6,hue,0.5);
}
function die(){
  state="over";overT=0;
  shake=1;flash=0.8;slowmo=0.2;
  noiseBurst(0.6,0.35);tone(220,0.9,"sawtooth",0.18,40);
  const [x,y]=P(ship.r,ship.a);
  boom(x,y,70,hue,1.6);
  const sc=Math.floor(score);
  newBest=sc>best;
  if(newBest){best=sc;try{localStorage.setItem("ob_best",best);}catch(e){}}
}
function action(){
  initAudio();
  if(state==="title"){reset();state="play";tone(440,0.2,"triangle",0.1,880);return;}
  if(state==="pause"){state="play";return;}
  if(state==="over"){if(overT>0.6){reset();state="play";tone(440,0.2,"triangle",0.1,880);}return;}
  jump();
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();action();});
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();action();}
  else if(e.code==="KeyM"){muted=!muted;}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&state==="play")state="pause";
});

/* ---------- update ---------- */
function update(dt){
  hue=(210+t*4)%360;
  if(state==="play"){
    t+=dt;
    const d=diffLv();
    score+=dt*(12+28*d);
    comboT-=dt;if(comboT<=0)combo=1;
    // ship motion
    ship.jumpCD=Math.max(0,ship.jumpCD-dt);
    ship.a=angNorm(ship.a+(1.25+1.0*d)*ship.dir*dt);
    ship.r+=(ringR(ship.ring)-ship.r)*Math.min(1,dt*9);
    trail.push({r:ship.r,a:ship.a,life:0.45});
    // spawning
    spawnT-=dt;
    if(spawnT<=0){spawnT=1.5-1.0*d+Math.random()*0.3;spawnObstacle();}
    gemT-=dt;
    if(gemT<=0){gemT=2.2-0.8*d+Math.random();spawnGem();}
    // music beat
    beatT-=dt;
    if(beatT<=0){
      beatT=0.5-0.15*d;
      beatN++;
      tone(beatN%8===0?82:55,0.18,"sine",0.16,30);
      if(beatN%2===1)note((beatN*3)%12,196,0.22,"triangle",0.04);
    }
    // gem collect
    for(let i=gems.length-1;i>=0;i--){
      const g=gems[i];
      if(Math.abs(ship.r-ringR(g.ring))<0.02&&Math.abs(angDiff(ship.a,g.a))<0.075){
        const [x,y]=P(g.a===undefined?0:ringR(g.ring),g.a);
        gems.splice(i,1);
        if(g.shield){
          ship.shield=true;
          tone(660,0.3,"sine",0.12,1320);tone(990,0.3,"sine",0.08,1980);
          boom(x,y,18,185,0.8);
        }else{
          combo=comboT>0?Math.min(8,combo+1):1;
          comboT=4;
          score+=100*combo;
          note(combo+2,392,0.18,"sine",0.1);
          boom(x,y,12,48,0.7);
        }
      }
    }
    // collision with arcs
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      if(o.life<0.6||o.life>o.maxLife-0.3)continue;
      if(Math.abs(ship.r-ringR(o.ring))<ARC_HALF+SHIP_RAD){
        const rel=angNorm(ship.a-o.a0);
        if(rel<o.span){
          if(ship.shield){
            ship.shield=false;
            obstacles.splice(i,1);
            shake=0.5;flash=0.3;
            noiseBurst(0.25,0.2);tone(880,0.25,"square",0.08,220);
            const [x,y]=P(ship.r,ship.a);
            boom(x,y,30,185,1.1);
          }else{
            die();
          }
          break;
        }
      }
    }
  }
  // world (runs in all states for visuals)
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.a0=angNorm(o.a0+o.w*dt);
    o.life+=dt;
    if(o.life>o.maxLife)obstacles.splice(i,1);
  }
  for(const g of gems)g.spin+=dt*3;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.2,dt);p.vy*=Math.pow(0.2,dt);
    p.life-=dt/p.maxLife;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=trail.length-1;i>=0;i--){
    trail[i].life-=dt;
    if(trail[i].life<=0)trail.splice(i,1);
  }
}

/* ---------- draw ---------- */
function text(str,x,y,size,col,align,weight){
  ctx.font=(weight||"700")+" "+Math.floor(size)+"px 'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";
  ctx.textAlign=align||"center";ctx.textBaseline="middle";
  ctx.fillStyle=col;ctx.fillText(str,x,y);
}
function draw(now){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.shadowBlur=0;
  ctx.fillStyle="#04030a";ctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){
    ctx.globalAlpha=0.35+0.3*Math.sin(now*0.001+s.p);
    ctx.fillStyle="#cdd6ff";
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  // screen shake
  ctx.translate((Math.random()-0.5)*shake*16*DPR,(Math.random()-0.5)*shake*16*DPR);
  // rings
  for(let i=0;i<3;i++){
    ctx.beginPath();ctx.arc(CX,CY,ringR(i)*S,0,TAU);
    ctx.strokeStyle=i===ship.ring&&state==="play"?"rgba(150,170,255,0.30)":"rgba(120,130,200,0.12)";
    ctx.lineWidth=1.2*DPR;
    ctx.stroke();
  }
  // sun
  const pulse=1+0.06*Math.sin(now*0.004);
  const sunR=0.07*S*pulse;
  const grad=ctx.createRadialGradient(CX,CY,0,CX,CY,sunR*2.4);
  grad.addColorStop(0,"hsla("+hue+",100%,75%,0.95)");
  grad.addColorStop(0.35,"hsla("+hue+",95%,55%,0.55)");
  grad.addColorStop(1,"hsla("+hue+",95%,50%,0)");
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(CX,CY,sunR*2.4,0,TAU);ctx.fill();
  ctx.fillStyle="hsla("+hue+",100%,88%,1)";
  ctx.beginPath();ctx.arc(CX,CY,sunR*0.55,0,TAU);ctx.fill();
  // obstacles
  for(const o of obstacles){
    let alpha=0.9;
    if(o.life<0.6)alpha=o.life/0.6*0.3;
    else if(o.life>o.maxLife-1)alpha=Math.max(0,(o.maxLife-o.life))*0.9;
    const h=(hue+40+o.ring*25)%360;
    ctx.strokeStyle="hsla("+h+",95%,62%,"+alpha.toFixed(3)+")";
    ctx.lineWidth=ARC_HALF*2*S;
    ctx.lineCap="round";
    ctx.shadowColor="hsla("+h+",95%,60%,0.8)";
    ctx.shadowBlur=14*DPR;
    ctx.beginPath();ctx.arc(CX,CY,ringR(o.ring)*S,o.a0,o.a0+o.span);ctx.stroke();
  }
  ctx.shadowBlur=0;
  // gems
  for(const g of gems){
    const [x,y]=P(ringR(g.ring),g.a);
    const sz=0.011*S*(1+0.15*Math.sin(g.spin*2));
    ctx.save();ctx.translate(x,y);ctx.rotate(g.spin);
    ctx.fillStyle=g.shield?"hsl(185,100%,65%)":"hsl(48,100%,62%)";
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12*DPR;
    ctx.beginPath();
    ctx.moveTo(0,-sz);ctx.lineTo(sz*0.7,0);ctx.lineTo(0,sz);ctx.lineTo(-sz*0.7,0);
    ctx.closePath();ctx.fill();
    if(g.shield){ctx.strokeStyle="rgba(160,255,255,0.7)";ctx.lineWidth=1.5*DPR;ctx.beginPath();ctx.arc(0,0,sz*1.8,0,TAU);ctx.stroke();}
    ctx.restore();
  }
  ctx.shadowBlur=0;
  // trail
  for(const tr of trail){
    const [x,y]=P(tr.r,tr.a);
    const a=tr.life/0.45;
    ctx.fillStyle="hsla("+hue+",90%,70%,"+(a*0.4).toFixed(3)+")";
    ctx.beginPath();ctx.arc(x,y,SHIP_RAD*S*a*0.8,0,TAU);ctx.fill();
  }
  // particles
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle="hsl("+p.h+",95%,65%)";
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  // ship
  if(state!=="over"){
    const [x,y]=P(ship.r,ship.a);
    ctx.save();ctx.translate(x,y);ctx.rotate(ship.a+ship.dir*Math.PI/2);
    const sz=SHIP_RAD*S;
    ctx.fillStyle="#fff";
    ctx.shadowColor="hsla("+hue+",95%,70%,1)";ctx.shadowBlur=16*DPR;
    ctx.beginPath();
    ctx.moveTo(sz*1.7,0);ctx.lineTo(-sz,sz*0.95);ctx.lineTo(-sz*0.5,0);ctx.lineTo(-sz,-sz*0.95);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    if(ship.shield){
      ctx.strokeStyle="rgba(120,240,255,0.85)";ctx.lineWidth=2*DPR;
      ctx.beginPath();ctx.arc(0,0,sz*2.3,0,TAU);ctx.stroke();
    }
    ctx.restore();
  }
  // UI
  ctx.setTransform(1,0,0,1,0,0);
  const fs=Math.max(14*DPR,S*0.035);
  if(state==="play"||state==="pause"||state==="over"){
    text("SCORE "+Math.floor(score),S*0.03,S*0.045,fs,"rgba(220,228,255,0.9)","left");
    text("BEST "+best,W-S*0.03,S*0.045,fs*0.8,"rgba(160,170,220,0.8)","right");
    if(combo>1&&state==="play")
      text("×"+combo,CX,CY-0.08*S,fs*1.3,"hsla(48,100%,65%,"+Math.min(1,comboT/1.5).toFixed(2)+")");
  }
  if(state==="title"){
    ctx.fillStyle="rgba(4,3,14,0.45)";ctx.fillRect(0,0,W,H);
    text("ORBIT BREAKER",CX,CY-0.16*S,S*0.085,"#fff");
    text("クリックでスタート",CX,CY+0.10*S,S*0.038,"hsla("+hue+",90%,75%,"+(0.6+0.4*Math.sin(now*0.004)).toFixed(2)+")");
    text("タップで軌道チェンジ。光るアークを避けて ◆ を集めろ",CX,CY+0.17*S,S*0.026,"rgba(190,200,240,0.85)","center","400");
    text("連続で取るとコンボ倍率アップ。水色の◆はシールド",CX,CY+0.215*S,S*0.026,"rgba(190,200,240,0.7)","center","400");
    if(best>0)text("BEST "+best,CX,CY+0.29*S,S*0.03,"rgba(255,215,120,0.9)");
  }
  if(state==="pause"){
    ctx.fillStyle="rgba(4,3,14,0.6)";ctx.fillRect(0,0,W,H);
    text("一時停止中",CX,CY-0.03*S,S*0.05,"#fff");
    text("クリックで再開",CX,CY+0.05*S,S*0.03,"rgba(190,200,240,0.85)");
  }
  if(state==="over"&&overT>0.4){
    ctx.fillStyle="rgba(4,3,14,0.5)";ctx.fillRect(0,0,W,H);
    text("GAME OVER",CX,CY-0.13*S,S*0.07,"#fff");
    text("SCORE "+Math.floor(score),CX,CY-0.02*S,S*0.05,"hsla(48,100%,65%,1)");
    if(newBest)text("NEW RECORD!",CX,CY+0.06*S,S*0.035,"hsl(185,100%,65%)");
    else text("BEST "+best,CX,CY+0.06*S,S*0.03,"rgba(190,200,240,0.8)");
    if(overT>0.6)text("クリックでリトライ",CX,CY+0.15*S,S*0.03,"rgba(190,200,240,"+(0.5+0.4*Math.sin(now*0.004)).toFixed(2)+")");
  }
  // flash
  if(flash>0){
    ctx.fillStyle="rgba(255,255,255,"+(flash*0.5).toFixed(3)+")";
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  let dt=Math.min(0.033,(now-last)/1000);
  last=now;
  shake=Math.max(0,shake-dt*2.2);
  flash=Math.max(0,flash-dt*1.5);
  if(state==="over"){overT+=dt;slowmo+=(1-slowmo)*dt*1.5;dt*=slowmo;}
  if(state!=="pause")update(dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
